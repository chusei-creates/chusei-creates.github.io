<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chusei.exe</title>
    <meta name="description" content="Apps and games by chusei.exe, a solo maker in the Philippines." />
    <link rel="icon" href="saktocart/icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --page: #fff9f1; --paper: #fff; --ink: #1f1d1b; --soft: #57534f; --line: #e2dfdb; --orange: #b04a12; }
      @media (prefers-color-scheme: dark) {
        :root { --page: #1b1b1d; --paper: #242426; --ink: #e9e7e4; --soft: #c4c0bb; --line: #3a3a3d; --orange: #ff9d5c; }
      }
      body { margin: 0; background: var(--page); color: var(--ink); font: 400 17px/1.6 Nunito, system-ui, sans-serif; }
      main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
      h1 { font-weight: 800; font-size: 32px; margin: 0; }
      .lead { color: var(--soft); margin: 4px 0 32px; }
      .app { display: flex; gap: 16px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
      .app img { width: 64px; height: 64px; border-radius: 14px; }
      .app h2 { font-weight: 800; font-size: 20px; margin: 0; }
      .app p { margin: 0 0 4px; color: var(--soft); }
      a { color: var(--orange); font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>chusei.exe</h1>
      <p class="lead">Apps and games by a solo maker in the Philippines.</p>
      <div class="app">
        <img src="saktocart/icon.png" alt="" width="64" height="64" />
        <div>
          <h2>SaktoCart</h2>
          <p>Grocery lists with a live budget, so you know your total before the cashier.</p>
          <a href="saktocart/privacy/">Privacy policy</a> · <a href="https://facebook.com/chusei.exe.dev" rel="noopener">Contact</a>
        </div>
      </div>
    </main>
  </body>
</html>
